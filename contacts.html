<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Scholaco</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            maroon: {
              50: '#fdf2f4', 100: '#fce7eb', 200: '#f9d0d9', 300: '#f4a9ba',
              400: '#ec7a94', 500: '#df4d6f', 600: '#cb2d55', 700: '#a91e43',
              800: '#800020', 900: '#6b1a35', 950: '#3d0a1a'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      box-sizing: border-box;
    }
  </style>
</head>

<body class="h-full font-body bg-white text-gray-800 overflow-auto flex flex-col">

  <nav class="fixed top-0 left-0 right-0 z-50 bg-white/90 backdrop-blur-md border-b border-maroon-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4">
      <div class="flex items-center justify-between">
        <div class="flex flex-col">
          <div class="flex items-baseline gap-0">
<a href="/">
  <img src="/images/scholaco_logo_transparent.png" alt="Scholaco Logo" class="h-10 w-auto">
</a>
            </a>
          </div>
          <div class="flex flex-col"></div>
        </div>
        <div class="hidden md:flex items-center gap-8">
          <a href="/#features" class="nav-link text-gray-600 hover:text-maroon-800 font-medium">Features</a>
          <a href="/#how-it-works" class="nav-link text-gray-600 hover:text-maroon-800 font-medium">How It Works</a>
        </div>
        <div class="flex items-center gap-4">
          <a href="/login.html" class="text-gray-600 hover:text-maroon-800 font-medium">Login</a>
          <a href="/signup.html" class="btn-primary px-4 py-2 rounded-full text-white font-semibold">Sign Up</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="flex-grow pt-32 pb-16">
    <div class="max-w-2xl mx-auto px-4 sm:px-6">
      <div class="glass-card rounded-2xl p-6 sm:p-8 shadow-2xl">
        <div class="text-center mb-8">
          <h1 class="font-display text-3xl font-bold mb-4">Contact Us</h1>
          <p class="text-gray-600">Have questions or need help? We'd love to hear from you!</p>
        </div>

        <form id="contact-form" class="space-y-5">
          <div>
            <label for="contact-name" class="block text-sm font-medium text-gray-700 mb-2">Name *</label>
            <input type="text" id="contact-name"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 input-focus outline-none transition-all"
              placeholder="Your full name" required>
          </div>
          <div>
            <label for="contact-email" class="block text-sm font-medium text-gray-700 mb-2">Email Address *</label>
            <input type="email" id="contact-email"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 input-focus outline-none transition-all"
              placeholder="your.email@example.com" required>
          </div>
          <div>
            <label for="contact-message" class="block text-sm font-medium text-gray-700 mb-2">Message *</label>
            <textarea id="contact-message" rows="5"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 input-focus outline-none transition-all resize-none"
              placeholder="How can we help you?" required></textarea>
          </div>
          <div class="pt-4">
            <button type="submit" id="send-contact-btn"
              class="w-full btn-primary px-6 py-3 rounded-xl text-white font-semibold transition-all">Send
              Message</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="py-12 bg-gray-900 text-gray-400 mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">
      <div class="flex flex-col md:flex-row justify-between items-center gap-6">
        <div class="flex items-baseline gap-0">
  <a href="/">
  <img src="/images/logo-maroon.png" alt="Scholaco Logo" class="h-10 w-auto">
  </a>
          </a>
        </div>
        <div class="flex gap-6 sm:gap-8 text-xs sm:text-sm">
          <a href="/privacy.html" class="hover:text-white transition-colors">Privacy</a>
          <a href="/terms.html" class="hover:text-white transition-colors">Terms</a>
          <a href="/contacts.html" class="text-white font-semibold">Contact</a>
        </div>
        <div class="text-xs sm:text-sm">© 2026 Scholaco. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <div id="toast-container" class="fixed top-4 right-4 sm:bottom-6 sm:right-6 sm:top-auto z-50 flex flex-col gap-2">
  </div>

  <script type="module" src="/src/js/app.js"></script>
</body>

</html>
