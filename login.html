<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholaco - Log In</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            maroon: {
              50: '#fdf2f4', 100: '#fce7eb', 200: '#f9d0d9', 300: '#f4a9ba',
              400: '#ec7a94', 500: '#df4d6f', 600: '#cb2d55', 700: '#a91e43',
              800: '#800020', 900: '#6b1a35', 950: '#3d0a1a'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      box-sizing: border-box;
    }
  </style>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/favicon.ico" />
  <meta name="theme-color" content="#7B1C2E" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Scholaco" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
</head>

<body class="h-full font-body bg-white text-gray-800 overflow-auto">

  <div class="min-h-screen hero-gradient flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <a href="index.html"
          class="inline-flex items-center gap-2 text-maroon-600 hover:text-maroon-800 mb-6 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
          <span>Back to Home</span>
        </a>
        <div class="flex items-center justify-center gap-3 mb-4">
          <img src="public/images/scholaco_logo_transparent.png" alt="Scholaco Logo" class="h-10 w-auto">
        </div>
        <h1 class="font-display text-3xl font-bold text-gray-800">Welcome Back</h1>
        <p class="text-gray-600 mt-2">Sign in to continue your scholarship journey</p>
      </div>

      <div class="glass-card rounded-2xl p-6 sm:p-8 shadow-xl">

        <div id="login-error"
          class="hidden mb-4 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl px-4 py-3"></div>

        <form id="login-form" class="space-y-6">
          <div>
            <label for="login-email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
            <input type="email" id="login-email"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 input-focus outline-none transition-all"
              placeholder="you@example.com" required>
          </div>
          <div>
            <label for="login-password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
            <input type="password" id="login-password"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 input-focus outline-none transition-all"
              placeholder="••••••••" required>
          </div>
          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-maroon-600 focus:ring-maroon-500">
              <span class="text-sm text-gray-600">Remember me</span>
            </label>
            <a href="#" class="text-sm text-maroon-600 hover:text-maroon-800 font-medium">Forgot password?</a>
          </div>
          <button type="submit" id="login-btn"
            class="w-full bg-maroon-800 btn-primary py-4 rounded-xl text-white font-semibold text-lg">
            Sign In
          </button>
        </form>

        <p class="mt-8 text-center text-gray-600">
          Don't have an account?
          <a href="signup.html" class="text-maroon-600 hover:text-maroon-800 font-semibold">Sign up free</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from '/src/js/supabase.js';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('login-btn');
      const errorEl = document.getElementById('login-error');
      errorEl.classList.add('hidden');

      btn.disabled = true;
      btn.textContent = 'Signing in...';

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        errorEl.textContent = error.message;
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Sign In';
        return;
      }

      // Supabase has now stored the session in localStorage
      // dashboard.html will pick it up via getSession()
      sessionStorage.setItem('scholaco_welcome_trigger', 'true');
      sessionStorage.removeItem('scholaco_welcome_seen');
      window.location.href = 'dashboard.html';
    });
  </script>
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(() => console.log('[SW] Registered'))
          .catch((err) => console.error('[SW] Error:', err));
      });
    }
  </script>

</body>

</html>
